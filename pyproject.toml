[project]
name = "pv-manager"
version = "0.1.0"
description = "Privacy-first Home Assistant PV and large-load manager with its own custom UI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[project.optional-dependencies]
# Only needed to reproduce the CI lint job locally.
dev = ["ruff>=0.16,<0.17"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["custom_components/pv_manager/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.pv_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
