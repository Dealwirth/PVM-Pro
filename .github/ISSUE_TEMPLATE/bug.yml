name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bitte **keine** API-Schlüssel, Tokens, Adressen, Kalendertexte oder
        vollständige Verbrauchsdaten posten. Pseudonymisierte Angaben genügen.
  - type: input
    id: version
    attributes:
      label: PV-Manager-Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home-Assistant-Version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
      description: Beschreibe, was du erwartet hast und was stattdessen passiert ist.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevante Logzeilen (redigiert)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe alle sensiblen Daten aus dem Bericht entfernt.
          required: true
